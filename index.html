<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>亞運聯動獎勵開啟</title>
<meta name="description" content="Identity V 第五人格 - 2026愛知·名古屋亞運會eSports聯動登入即領">
<meta property="og:title" content="亞運聯動獎勵開啟">
<meta property="og:description" content="Identity V 第五人格 - 2026愛知·名古屋亞運會eSports聯動登入即領 - 四選二福利立即領取">
<meta property="og:image" content="./image_615b45.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="第五人格">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>*{font-family:"Noto Sans TC",ui-sans-serif,system-ui}</style>
</head>
<body class="bg-[#FFF8E7] min-h-screen">
<div class="mx-auto w-full max-w-[1120px] px-4 sm:px-6 pt-5 sm:pt-8 pb-24">
  <div class="bg-white rounded-[24px] p-[12px] shadow-[0_20px_60px_rgba(120,80,20,0.10),0_4px_16px_rgba(0,0,0,0.06)] border border-[#F5E9D6]/60">
    <div class="rounded-[16px] overflow-hidden bg-[#FFFEFA] relative">
      <img src="./image_615b45.png" alt="Asian Games Version 聯動獎勵" class="w-full h-auto block object-contain">
    </div>
  </div>
  <div class="mt-5 sm:mt-6 grid grid-cols-2 gap-3 sm:gap-4 lg:grid-cols-4" id="grid"></div>
  <div class="mx-auto mt-8 max-w-[520px]">
    <button id="btn" class="w-full h-[54px] rounded-full flex items-center justify-center gap-2 font-black text-[17px] bg-[#F3F0E6] text-[#B8B0A0] border border-black/5 cursor-not-allowed">
      <span>立即領取</span><span id="count" class="bg-white border border-black/10 px-2 py-[2px] rounded-full text-[13px]">0/2</span>
    </button>
    <p id="tip" class="mt-3 text-center text-[12px] text-[#A89F8A]">請選擇 2 項獎勵以繼續</p>
  </div>
  <div class="mt-8 text-center">
    <div class="h-px w-[88px] mx-auto bg-gradient-to-r from-transparent via-black/10 to-transparent mb-3"></div>
    <p class="text-[11px] tracking-[0.18em] text-[#B8AD8E]">限時兌換 · 亞運聯動 · 2026愛知名古屋</p>
  </div>
</div>
<script>
const rewards=[
 {id:"essence2",no:"01",title:"第四十四賽季•精華2",desc:"x20 賽季精華 · 限時掉落"},
 {id:"essence3",no:"02",title:"第四十四賽季•精華3",desc:"x30 紀念珍藏 · 盲盒驚喜"},
 {id:"skin",no:"03",title:"通用稀世時裝解鎖卡",desc:"x1 限定稀世 · 自選解鎖"},
 {id:"inspiration",no:"04",title:"靈感",desc:"x1000 通用貨幣 · 隨心兌換"},
];
let selected=[];
const grid=document.getElementById('grid');
const btn=document.getElementById('btn');
const countEl=document.getElementById('count');
const tip=document.getElementById('tip');
function render(){
 grid.innerHTML='';
 rewards.forEach(r=>{
  const isSel=selected.includes(r.id);
  const div=document.createElement('button');
  div.className=`text-left rounded-[20px] p-[14px] sm:p-[18px] border-[2px] transition-all relative ${isSel?'bg-[#FFF8CC] border-[#FFB800] shadow-[0_0_0_3px_rgba(255,184,0,0.18)]':'bg-white border-[#EDE6D6] hover:border-[#E0D5B8]'}`;
  div.innerHTML=`<div class="flex justify-between"><span class="text-[11px] font-black tracking-widest px-[7px] py-[2px] rounded-full border ${isSel?'bg-[#1A1A1A] text-[#FFDE5A] border-[#1A1A1A]':'bg-white text-[#9A9A9A] border-black/10'}">#${r.no}</span><span class="w-[20px] h-[20px] rounded-full border-[1.5px] flex items-center justify-center ${isSel?'bg-[#FFB800] border-[#FFB800]':'bg-white border-black/15'}">${isSel?'✔':''}</span></div><div class="mt-3"><div class="text-[13px] font-extrabold text-[#1E1E1E]">${r.title}</div><div class="mt-1 text-[11px] text-[#9C8E72]">${r.desc}</div></div>`;
  div.onclick=()=>{
    if(isSel){selected=selected.filter(x=>x!==r.id)}
    else{if(selected.length>=2){selected.shift()} selected.push(r.id)}
    update();
  };
  grid.appendChild(div);
 });
}
function update(){
 render();
 countEl.textContent=`${selected.length}/2`;
 if(selected.length===2){
  btn.className="w-full h-[54px] rounded-full flex items-center justify-center gap-2 font-black text-[17px] bg-gradient-to-b from-[#FFDE5A] to-[#FFB800] text-[#1A1A1A] shadow-[0_10px_24px_rgba(255,184,0,0.35)] active:scale-[0.98]";
  tip.textContent="已選滿 2 項 · 點擊領取前往兌換";
  btn.onclick=()=>window.open("https://lin.ee/7vJoMzX","_blank");
 }else{
  btn.className="w-full h-[54px] rounded-full flex items-center justify-center gap-2 font-black text-[17px] bg-[#F3F0E6] text-[#B8B0A0] border border-black/5 cursor-not-allowed";
  tip.textContent="請選擇 2 項獎勵以繼續";
  btn.onclick=null;
 }
}
update();
</script>
</body>
</html>
